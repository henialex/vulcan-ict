<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Site Settings | Vulcan ICT CMS</title>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>

  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed": "#2c1700",
            "outline": "#6d7980",
            "surface-dim": "#d9dadb",
            "on-primary-fixed": "#001e2c",
            "surface-container-high": "#e7e8e9",
            "surface-container-lowest": "#ffffff",
            "tertiary-fixed": "#ffdcbc",
            "tertiary-container": "#f59a24",
            "inverse-surface": "#2e3132",
            "secondary-fixed-dim": "#a0cce7",
            "inverse-on-surface": "#f0f1f2",
            "surface-container": "#edeeef",
            "inverse-primary": "#78d1ff",
            "surface-container-highest": "#e1e3e4",
            "primary-container": "#06bcf9",
            "background": "#f8f9fa",
            "error": "#ba1a1a",
            "on-secondary-fixed-variant": "#1c4c62",
            "on-secondary-container": "#3a667d",
            "primary-fixed": "#c2e8ff",
            "on-surface": "#191c1d",
            "on-secondary": "#ffffff",
            "on-primary-fixed-variant": "#004d68",
            "on-primary": "#ffffff",
            "outline-variant": "#bcc8d1",
            "surface-bright": "#f8f9fa",
            "surface": "#f8f9fa",
            "error-container": "#ffdad6",
            "secondary": "#37637b",
            "primary": "#006689",
            "tertiary-fixed-dim": "#ffb86c",
            "on-background": "#191c1d",
            "on-surface-variant": "#3d484f",
            "surface-variant": "#e1e3e4",
            "surface-container-low": "#f3f4f5",
            "on-primary-container": "#004862",
            "on-error": "#ffffff",
            "on-secondary-fixed": "#001e2c",
            "primary-fixed-dim": "#78d1ff",
            "secondary-container": "#b6e3fe",
            "on-tertiary-fixed-variant": "#683c00",
            "surface-tint": "#006689",
            "on-tertiary-container": "#623800",
            "on-error-container": "#93000a",
            "secondary-fixed": "#c2e8ff",
            "tertiary": "#895100",
            "on-tertiary": "#ffffff"
          }
        },
      },
    }
  </script>

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; vertical-align: middle; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    .bg-gradient-primary { background: linear-gradient(135deg, #006689 0%, #06bcf9 100%); }
  </style>
</head>

<body class="bg-background text-on-surface font-body">
    <aside id="vulcanAdminSidebar" class="h-screen w-64 fixed left-0 top-0 overflow-y-auto bg-slate-100 flex flex-col py-6 px-4 z-50"></aside>

  <header class="fixed top-0 right-0 w-[calc(100%-16rem)] h-16 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl z-40 border-b border-slate-200/50 dark:border-slate-800/50 flex justify-between items-center px-8">
    <div class="flex items-center gap-4 flex-1">
      <div class="relative w-full max-w-md">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
        <input class="w-full pl-10 pr-4 py-2 bg-surface-container-low border-none rounded-full text-sm focus:ring-2 focus:ring-primary-container focus:bg-surface-container-lowest transition-all" placeholder="Search settings..." type="text"/>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <button id="saveTopBtn" class="bg-gradient-primary text-white px-6 py-3 rounded-xl flex items-center gap-2 font-bold shadow-lg shadow-primary/20 hover:-translate-y-1 transition-all" type="button">
        <span class="material-symbols-outlined">save</span>
        Save
      </button>
    </div>
  </header>

  <main class="ml-64 mt-16 p-8 min-h-[calc(100vh-4rem)]">
    <div class="max-w-5xl mx-auto">
      <div class="mb-10">
        <nav class="flex items-center gap-2 text-xs text-outline mb-2 uppercase tracking-widest font-semibold">
          <span>Admin</span>
          <span class="material-symbols-outlined text-[10px]">chevron_right</span>
          <span class="text-primary">Site Settings</span>
        </nav>
        <h2 class="text-4xl font-extrabold tracking-tight font-headline text-on-surface">Global Website Settings</h2>
        <p class="text-on-surface-variant mt-2 max-w-xl">Edit footer, social links, office info, and map embed content.</p>
      </div>

      <div id="successBox" class="mb-8 rounded-xl border border-green-200 bg-green-50 px-5 py-4 text-sm font-medium text-green-700 hidden">
        Settings saved successfully!
      </div>
      <div id="errorBox" class="mb-8 rounded-xl border border-red-200 bg-red-50 px-5 py-4 text-sm font-medium text-red-700 hidden"></div>

      <form id="settingsForm" class="space-y-8">
        <input type="hidden" id="settingsId" value=""/>

        <section class="bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-primary rounded-full"></span>
            Branding
          </h3>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Site Name</label>
          <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="site_name" required />
        </section>

        <section class="bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-tertiary-container rounded-full"></span>
            Footer Content
          </h3>
          <div class="grid grid-cols-1 gap-6">
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Footer About</label>
              <textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all resize-none" rows="5" name="footer_about"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Newsletter Text</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="newsletter_text" />
            </div>
          </div>
        </section>

        <section class="bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-secondary rounded-full"></span>
            Social Links
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Facebook</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="facebook_link" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Twitter</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="twitter_link" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Instagram</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="instagram_link" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">LinkedIn</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="linkedin_link" />
            </div>
          </div>
        </section>

        <section class="bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-primary-container rounded-full"></span>
            Office Info
          </h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">City</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="office_city" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Phone</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="office_phone" />
            </div>
            <div class="md:col-span-2">
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Address</label>
              <textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all resize-none" rows="3" name="office_address"></textarea>
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Hours</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="office_hours" />
            </div>
            <div>
              <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Email</label>
              <input class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all" name="office_email" />
            </div>
          </div>
        </section>

        <section class="bg-surface-container-lowest rounded-xl p-8 border border-outline-variant/10">
          <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
            <span class="w-1.5 h-6 bg-error-container rounded-full"></span>
            Map Embed
          </h3>
          <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Map Embed URL</label>
          <textarea class="w-full bg-surface-container-low border-none rounded-xl px-4 py-3 focus:ring-2 focus:ring-primary-container transition-all resize-none font-mono text-xs" rows="4" name="map_embed_url"></textarea>
        </section>

        <div class="flex justify-end">
          <button class="bg-gradient-primary text-white px-10 py-3 rounded-xl text-sm font-bold shadow-xl shadow-primary/30 hover:scale-[1.02] active:scale-95 transition-all flex items-center gap-2" type="submit">
            <span class="material-symbols-outlined">save</span>
            Save Settings
          </button>
        </div>
      </form>
    </div>
  </main>

  <script src="admin.js"></script>
  <script src="shared.js"></script>
  <script src="admin-layout.js"></script>
  <script>
    (function () {
      if (!VulcanAdminUI.requireAuth()) return;
      VulcanAdminLayout.renderSidebar("site-settings");
      VulcanAdminUI.rewriteAdminLinks();
      VulcanAdminUI.adminLogoutLinkHandler();

      const form = document.getElementById("settingsForm");
      const settingsIdEl = document.getElementById("settingsId");
      const successBox = document.getElementById("successBox");
      const errorBox = document.getElementById("errorBox");
      const saveTopBtn = document.getElementById("saveTopBtn");

      function showError(msg) {
        errorBox.textContent = msg || "Failed to save settings.";
        errorBox.classList.remove("hidden");
      }

      function clearAlerts({ keepSuccess = false } = {}) {
        if (!keepSuccess) successBox.classList.add("hidden");
        errorBox.classList.add("hidden");
        errorBox.textContent = "";
      }

      function fillForm(settings) {
        if (!settings) return;
        settingsIdEl.value = settings.id || "";
        for (const [k, v] of Object.entries(settings)) {
          const input = form.querySelector(`[name="${k}"]`);
          if (input) input.value = v ?? "";
        }
      }

      async function load({ keepSuccess = false } = {}) {
        clearAlerts({ keepSuccess });
        const { settings } = await VulcanAdmin.apiFetch("/admin/site-settings");
        if (settings) fillForm(settings);
      }

      async function save() {
        clearAlerts();
        saveTopBtn.disabled = true;
        saveTopBtn.classList.add("opacity-70");
        const payload = Object.fromEntries(new FormData(form).entries());
        const id = settingsIdEl.value;
        const path = id ? `/admin/site-settings/${encodeURIComponent(id)}` : "/admin/site-settings";
        const method = id ? "PUT" : "POST";

        try {
          const res = await VulcanAdmin.apiFetch(path, {
            method,
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });

          if (!id && res && res.id) settingsIdEl.value = res.id;
          await load({ keepSuccess: true });
          successBox.classList.remove("hidden");
        } finally {
          saveTopBtn.disabled = false;
          saveTopBtn.classList.remove("opacity-70");
        }
      }

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        save().catch((err) => showError(err.message));
      });

      saveTopBtn.addEventListener("click", () => {
        save().catch((err) => showError(err.message));
      });

      load().catch((err) => showError(err.message));
    })();
  </script>
</body>
</html>
