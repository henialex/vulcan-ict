<!DOCTYPE html>
<html class="light" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Add Partner | Vulcan ICT CMS</title>

  <link href="https://fonts.googleapis.com" rel="preconnect"/>
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          "colors": {
            "on-tertiary-fixed": "#2c1700",
            "outline": "#6d7980",
            "surface-dim": "#d9dadb",
            "on-primary-fixed": "#001e2c",
            "surface-container-high": "#e7e8e9",
            "surface-container-lowest": "#ffffff",
            "tertiary-fixed": "#ffdcbc",
            "tertiary-container": "#f59a24",
            "inverse-surface": "#2e3132",
            "secondary-fixed-dim": "#a0cce7",
            "inverse-on-surface": "#f0f1f2",
            "surface-container": "#edeeef",
            "inverse-primary": "#78d1ff",
            "surface-container-highest": "#e1e3e4",
            "primary-container": "#06bcf9",
            "background": "#f8f9fa",
            "error": "#ba1a1a",
            "on-secondary-fixed-variant": "#1c4c62",
            "on-secondary-container": "#3a667d",
            "primary-fixed": "#c2e8ff",
            "on-surface": "#191c1d",
            "on-secondary": "#ffffff",
            "on-primary-fixed-variant": "#004d68",
            "on-primary": "#ffffff",
            "outline-variant": "#bcc8d1",
            "surface-bright": "#f8f9fa",
            "surface": "#f8f9fa",
            "error-container": "#ffdad6",
            "secondary": "#37637b",
            "primary": "#006689",
            "tertiary-fixed-dim": "#ffb86c",
            "on-background": "#191c1d",
            "on-surface-variant": "#3d484f",
            "surface-variant": "#e1e3e4",
            "surface-container-low": "#f3f4f5",
            "on-primary-container": "#004862",
            "on-error": "#ffffff",
            "on-secondary-fixed": "#001e2c",
            "primary-fixed-dim": "#78d1ff",
            "secondary-container": "#b6e3fe",
            "on-tertiary-fixed-variant": "#683c00",
            "surface-tint": "#006689",
            "on-tertiary-container": "#623800",
            "on-error-container": "#93000a",
            "secondary-fixed": "#c2e8ff",
            "tertiary": "#895100",
            "on-tertiary": "#ffffff"
          }
        },
      },
    }
  </script>

  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24; vertical-align: middle; }
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3 { font-family: 'Manrope', sans-serif; }
    .gradient-btn { background: linear-gradient(135deg, #006689 0%, #06bcf9 100%); }
  </style>
</head>
<body class="bg-background text-on-surface">
    <aside id="vulcanAdminSidebar" class="h-screen w-64 fixed left-0 top-0 overflow-y-auto bg-slate-100 flex flex-col py-6 px-4 z-50"></aside>

  <header class="fixed top-0 right-0 w-[calc(100%-16rem)] h-16 bg-white/80 dark:bg-slate-950/80 backdrop-blur-xl z-40 border-b border-slate-200/50 dark:border-slate-800/50 flex justify-between items-center px-8">
    <div class="flex items-center gap-4 flex-1">
      <div class="relative w-full max-w-md">
        <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">search</span>
        <input class="w-full bg-surface-container-low border-none rounded-full pl-10 pr-4 py-2 text-sm focus:ring-2 focus:ring-primary-container transition-all" placeholder="Search partners..." type="text"/>
      </div>
    </div>
    <div class="flex items-center gap-6">
      <a href="/admin/partners" class="px-6 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-200 transition-all">Back</a>
    </div>
  </header>

  <main class="ml-64 pt-24 pb-16 px-8 min-h-screen">
    <div class="max-w-5xl mx-auto">
      <div id="successBox" class="mb-8 rounded-xl border border-green-200 bg-green-50 px-5 py-4 text-sm font-medium text-green-700 hidden">
        Partner added successfully!
      </div>

      <form id="createPartnerForm">
        <div class="flex justify-between items-end mb-10">
          <div>
            <nav class="flex items-center gap-2 text-xs text-slate-500 mb-2">
              <a href="/admin/partners">Partners</a>
              <span class="material-symbols-outlined text-[14px]">chevron_right</span>
              <span class="text-primary font-medium">Add Partner</span>
            </nav>
            <h2 class="text-4xl font-extrabold tracking-tight text-on-surface">Partner Profile</h2>
            <p class="text-on-surface-variant mt-2 max-w-lg">Add a new partner to the public homepage section.</p>
          </div>
          <div class="flex gap-3">
            <a href="/admin/partners" class="px-6 py-2.5 rounded-xl text-sm font-semibold text-slate-600 hover:bg-slate-200 transition-all">Discard</a>
            <button type="submit" class="gradient-btn text-white px-8 py-2.5 rounded-xl text-sm font-semibold shadow-xl shadow-primary/20 hover:-translate-y-1 transition-all">Save Partner</button>
          </div>
        </div>

        <div class="grid grid-cols-12 gap-6">
          <div class="col-span-12 lg:col-span-8 space-y-6">
            <section class="bg-surface-container-lowest rounded-xl p-8 transition-all">
              <h3 class="text-lg font-bold mb-6 flex items-center gap-2">
                <span class="w-1.5 h-6 bg-primary rounded-full"></span>
                Details
              </h3>

              <div class="space-y-6">
                <div>
                  <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Name</label>
                  <input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:bg-white focus:ring-0 border-b-2 border-transparent focus:border-primary transition-all text-lg font-medium" type="text" name="name" required />
                </div>
                <div class="grid grid-cols-2 gap-6">
                  <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Partner Type</label>
                    <input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:bg-white focus:ring-0 border-b-2 border-transparent focus:border-primary transition-all" type="text" name="partner_type" required />
                  </div>
                  <div>
                    <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Sort Order</label>
                    <input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:ring-0" type="number" name="sort_order" value="0" />
                  </div>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Description</label>
                  <textarea class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:bg-white focus:ring-0 border-b-2 border-transparent focus:border-primary transition-all resize-none" rows="4" name="description"></textarea>
                </div>
              </div>
            </section>
          </div>

          <div class="col-span-12 lg:col-span-4 space-y-6">
            <section class="bg-surface-container-lowest rounded-xl p-6 h-fit">
              <h3 class="text-sm font-bold uppercase tracking-widest text-slate-400 mb-4">Logo / Icon</h3>
              <div class="space-y-4">
                <div>
                  <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Logo Image Path</label>
                  <input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:ring-0" type="text" name="logo_image" placeholder="img/logos/ecta.png" />
                  <p class="text-[10px] text-slate-400 mt-2">Use a path under `front-end/` like `img/logos/...`</p>
                </div>
                <div>
                  <label class="block text-xs font-semibold text-on-surface-variant uppercase tracking-wider mb-2">Icon Class (fallback)</label>
                  <input class="w-full bg-surface-container-low border-none rounded-lg px-4 py-3 focus:ring-0" type="text" name="icon_class" placeholder="fa fa-industry" />
                </div>
              </div>
            </section>
          </div>
        </div>
      </form>
    </div>
  </main>

  <script src="admin.js"></script>
  <script src="shared.js"></script>
  <script src="admin-layout.js"></script>
  <script>
    (function(){
      if (!VulcanAdminUI.requireAuth()) return;
      VulcanAdminLayout.renderSidebar("partners");
      VulcanAdminUI.rewriteAdminLinks();
      VulcanAdminUI.adminLogoutLinkHandler();

      const form = document.getElementById("createPartnerForm");
      const successBox = document.getElementById("successBox");

      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        successBox.classList.add("hidden");
        const payload = Object.fromEntries(new FormData(form).entries());
        await VulcanAdmin.apiFetch("/admin/partners", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        successBox.classList.remove("hidden");
        setTimeout(() => (location.href = "partners.html"), 600);
      });
    })();
  </script>
</body>
</html>
